services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: financial_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d financial_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./financial-manager-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/financial_manager
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./financial-manager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
